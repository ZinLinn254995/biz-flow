name: AI Verification Gate

# Verification only. This workflow never modifies application source,
# never commits, and never generates code.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, tests, build, AI state
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'  # tests use node:fs globSync, which requires Node 22+
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Unit and integration tests
        run: npm run test

      - name: Production build
        run: npm run build

      - name: Dangling import check
        run: npm run verify:imports

      - name: Locked-area guard
        run: npm run verify:locked

      - name: AI state and handoff consistency
        run: npm run verify:ai
